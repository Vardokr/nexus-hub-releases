name: Announce release on Discord

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post release announcement
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          RELEASE_ASSETS: ${{ toJson(github.event.release.assets) }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Missing repository secret: DISCORD_RELEASE_WEBHOOK" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          name = os.environ.get("RELEASE_NAME") or os.environ["RELEASE_TAG"]
          notes = os.environ.get("RELEASE_NOTES", "").strip()
          if len(notes) > 3000:
              notes = notes[:2997].rstrip() + "..."

          repository = os.environ["REPOSITORY"]
          assets = json.loads(os.environ.get("RELEASE_ASSETS", "[]"))
          installers = [asset for asset in assets if asset.get("name", "").lower().endswith(".exe") and "setup" in asset.get("name", "").lower()]
          if not installers:
              installers = [asset for asset in assets if asset.get("name", "").lower().endswith(".exe")]
          installer_url = installers[0]["browser_download_url"] if installers else os.environ["RELEASE_URL"]
          description = notes or "Die neue Version von NEXUS HUB ist verfügbar."
          payload = {
              "embeds": [{
                  "title": f"NEXUS HUB {name} ist verfügbar",
                  "url": os.environ["RELEASE_URL"],
                  "description": description,
                  "color": 0x3D87F5,
                  "fields": [
                      {"name": "Download", "value": f"[Windows-Setup herunterladen]({installer_url})", "inline": True},
                      {"name": "Release-Notizen", "value": f"[Auf GitHub ansehen]({os.environ['RELEASE_URL']})", "inline": True},
                  ],
                  "footer": {"text": "NEXUS HUB · unabhängiges Community-Projekt, nicht mit Wargaming verbunden"},
              }],
              "allowed_mentions": {"parse": []},
          }
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "NEXUS-HUB-Release-Announcer"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
              print("Release announcement sent to Discord.")
          PY
